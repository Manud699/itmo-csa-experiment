name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: DeLaGuardo/setup-clojure@12.5
        with:
          lein: 2.11.2
          clj-kondo: latest
          cljfmt: latest

      - name: Lint
        run: clj-kondo --lint src test

      - name: Format check
        run: cljfmt check src test

      - name: Tests
        run: lein test